        "https://lh3.googleusercontent.com/aida-public/AB6AXuDmvKy5riw-fw8xQbF1KAPA28JkZZ2eXfNvbbpJRUs88lQOTVKThJyFuyIhLI5vb7LUgefhv_PTYSSFdqVLyeCr_0V_CreGfFzDnofMUcudlhfbgDlRInNVHnIE6Dbr07teSv20P01rzWWuUu53SKMdJpxKYUGgHBvVKi5L9pw2A2h8Bsgs4xz_rAybGJMYlhpoXyKkW0LtCrD7epb4rEtGacpqxHuKb4Ucd7ZcaiaAVb-XodnOUK-FNHFO7Sfg2mjCNDAjajTuB0hO",

    ];

    function getAsset(id) {
        return STITCH_ASSETS[id % STITCH_ASSETS.length];
    }

    async function loadProduct() {
        try {
            const productId = window.location.pathname.split('/').pop();
            const res = await fetch(`/api/products`);
            const products = await res.json();
            const product = products.find(p => p.product_id == productId) || products[0];

            const simRes = await fetch(`/api/similar/${productId}`);
            const similar = await simRes.json();

            const root = document.getElementById('details-root');
            root.innerHTML = `
                <!-- Hero Section -->
                <section class="relative min-h-[530px] flex flex-col items-center justify-center mb-12">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary/20 blur-[120px] rounded-full"></div>
                    <div class="relative z-10 w-full max-w-2xl transform hover:scale-[1.02] transition-transform duration-700 ease-out">
                        <img class="w-full h-auto drop-shadow-[0_35px_60px_rgba(211,148,255,0.2)]" src="${getAsset(product.product_id)}" alt="${product.name}"/>
                    </div>
                    <div class="mt-8 text-center hero-meta">
                        <span class="font-label text-[10px] tracking-[0.2em] text-primary uppercase mb-2 block">Series VII · ${product.category}</span>
                        <h2 class="font-headline text-4xl md:text-6xl font-extralight tracking-tighter text-white">${product.name}</h2>
                    </div>
                </section>

                <!-- Bento Info -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-16 info-bento">
                    <div class="md:col-span-8 p-8 rounded-xl bg-surface-container-low glass-glow relative overflow-hidden group">
                        <div class="relative z-10">
                            <h3 class="font-headline text-xl font-light text-white mb-4">The Narrative</h3>
                            <p class="text-on-surface-variant font-light leading-relaxed text-lg max-w-2xl">
                                ${product.name} is designed at the intersection of atmospheric engineering and acoustic luxury. Pure, weightless, and absolute discovery for the modern curator.
                            </p>
                        </div>
                    </div>
                    <div class="md:col-span-4 p-8 rounded-xl bg-surface-container-highest glass-glow border-t border-l border-white/5 flex flex-col justify-between">
                        <div>
                            <span class="font-label text-sm text-secondary tracking-widest uppercase">Market Value</span>
                            <div class="flex items-baseline gap-2 mt-2">
                                <span class="text-4xl font-headline font-extralight text-white">$${product.price}</span>
                            </div>
                        </div>
                        <div class="mt-8 space-y-4">
                            <button class="w-full py-4 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-semibold tracking-tight hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/20">Secure Acquisition</button>
                            <button class="w-full py-4 rounded-full bg-surface-variant/20 border border-outline-variant/30 text-secondary font-headline font-medium hover:bg-surface-variant/30 active:scale-[0.98] transition-all backdrop-blur-md">Vault It</button>
                        </div>
                    </div>
                </div>

                <!-- Curation Carousel -->
                <section class="mb-12 curation-section">
                    <div class="flex justify-between items-end mb-8 px-2">
                        <div>
                            <h3 class="font-headline text-2xl font-extralight text-white tracking-tight text-left">Discovery Affinity</h3>
                            <p class="text-on-surface-variant text-sm font-label text-left">Curated based on this fragment</p>
                        </div>
                    </div>
                    <div class="flex gap-6 overflow-x-auto pb-8 snap-x hide-scrollbar">
                        ${similar.map(p => `
                            <a href="/product/${p.product_id}" class="min-w-[280px] md:min-w-[320px] snap-start group text-left">
                                <div class="aspect-[4/5] rounded-2xl bg-surface-container-low overflow-hidden relative mb-4">
                                    <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 scale-110 group-hover:scale-100" src="${getAsset(p.product_id)}" alt="${p.name}"/>
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                </div>
                                <h4 class="text-white font-headline font-light tracking-tight px-1">${p.name}</h4>
                                <p class="text-primary text-sm font-label px-1">$${p.price}</p>
                            </a>
                        `).join('')}
                    </div>
                </section>
            `;

            gsap.to("#details-root", { opacity: 1, duration: 0.8 });
            gsap.from(".hero-meta", { y: 20, opacity: 0, delay: 0.3, duration: 1 });
            gsap.from(".info-bento", { scale: 0.95, opacity: 0, delay: 0.5, duration: 1 });

        } catch (err) {
            console.error("Failed to load product", err);
        }
    }

    window.addEventListener('DOMContentLoaded', loadProduct);
</script>
