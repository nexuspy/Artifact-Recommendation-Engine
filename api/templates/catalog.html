    async function loadProducts() {
        try {
            const res = await fetch('/api/products');
            const products = await res.json();
            const grid = document.getElementById('catalog-grid');
            const count = document.getElementById('item-count');
            
            grid.innerHTML = products.map((prod, idx) => `
                <div class="prod-card group bg-surface-container-low rounded-2xl overflow-hidden ghost-border card-glow transition-all duration-500 opacity-0 transform translate-y-8">
                    <div class="aspect-square relative overflow-hidden bg-[#1a1a1c]">

                            <span class="material-symbols-outlined text-sm">favorite</span>
                        </button>

                        <div class="flex justify-between items-start mb-2">

                                <h4 class="text-lg font-medium tracking-tight text-white">${prod.name}</h4>
                            </div>
                            <p class="text-sm font-bold text-primary">$${prod.price}</p>
                        </div>
                        <div class="mt-4 flex items-center justify-between">

                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            count.innerText = `Displaying ${products.length} exclusive artifacts`;
            
            gsap.to(".prod-card", {
                opacity: 1,
                y: 0,
                stagger: 0.05,
                duration: 0.8,
                ease: "power2.out"
            });

        } catch (err) {
            console.error("Failed to load products", err);
        }
