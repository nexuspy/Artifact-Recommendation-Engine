                            <div class="glass-panel p-6 rounded-3xl border-t border-l border-white/10 flex justify-between items-end translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500">
                                <div>
                                    <h3 class="text-2xl font-headline font-light text-white tracking-tight">${prod.name}</h3>
                                    <p class="text-on-surface-variant font-label text-xs uppercase tracking-widest mt-1">${prod.category} Collection</p>
                                    <div class="mt-4 flex items-center gap-4">
                                        <span class="text-xl font-bold text-primary">$${prod.price}</span>
                                    </div>
                                </div>
                                <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-primary to-primary-container text-on-primary flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
                                </div>
                            </div>
                        </div>
                    </a>
                `).join('');
            }

            // Load Trending
            const trendRes = await fetch('/api/trending');
            const trending = await trendRes.json();
            const trendScroll = document.getElementById('trending-scroll');
            trendScroll.innerHTML = trending.map((prod) => `
                <a href="/product/${prod.product_id}" class="trend-card min-w-[200px] md:min-w-[240px] snap-start group opacity-0 text-left">
                    <div class="relative aspect-[4/5] rounded-2xl overflow-hidden bg-surface-container-low mb-4">
                        <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" src="${getAsset(prod.product_id + 50)}" alt="${prod.name}"/>
                        <div class="absolute top-3 right-3">
                            <span class="material-symbols-outlined text-white/50 hover:text-primary transition-colors cursor-pointer">favorite</span>
                        </div>
                    </div>
                    <p class="font-label text-[10px] text-primary uppercase tracking-widest">${prod.category}</p>
                    <h4 class="font-headline font-normal text-on-surface mt-1">${prod.name}</h4>
                    <p class="font-bold text-white mt-1">$${prod.price}</p>
                </a>
            `).join('');

            // GSAP Entrance
            gsap.to(".prod-card", { opacity: 1, y: 0, stagger: 0.1, duration: 1, ease: "power4.out" });
            gsap.to(".trend-card", { opacity: 1, x: 0, stagger: 0.1, duration: 1, delay: 0.5, ease: "power3.out" });
            gsap.from("header", { y: -100, opacity: 0, duration: 1.2, ease: "expo.out" });

        } catch (err) {
            console.error("Failed to load data", err);
        }
    }
    window.addEventListener('DOMContentLoaded', loadData);
</script>
</body></html>
